<style>

.app{max-width:980px;margin:0 auto;padding:0 1rem 4rem}

.interval-btn:hover{border-color:var(--red);color:var(--red)}
.interval-btn.sel{background:var(--red);border-color:var(--red-d);color:#fff}
.custom-n{width:60px;padding:6px 8px;font-size:13px;border:1.5px solid var(--border2);border-radius:var(--r2);text-align:center;background:var(--card);color:var(--text)}
.custom-n:focus{outline:none;border-color:var(--red)}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin-bottom:5px}

.sel-row:hover{border-color:var(--border2);background:var(--hover)}
.sel-row.checked{border-color:var(--red);background:var(--red-bg)}

.sel-row .sthumb{width:56px;height:32px;object-fit:cover;border-radius:3px;background:var(--hover);flex-shrink:0}

.ptable td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.ptable tr:last-child td{border-bottom:none}
.ptable tr:hover td{background:var(--hover)}
.ptable .pnum{width:24px;color:var(--t3);font-weight:700;font-size:11px}
.ptable .ptitle{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.ptable .pdate{white-space:nowrap;color:var(--green);font-weight:700}

.qpip-ok{background:var(--green-bg);color:var(--green);border-color:var(--green-b)}
.qpip-idle{background:var(--hover);color:var(--t3);border-color:var(--border)}
.qpip-dead{background:var(--red-bg);color:var(--red);border-color:var(--red-b)}
.qpip-warn{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-b)}

.cost-tag{display:inline-block;padding:1px 6px;background:var(--green-bg);color:var(--green);border-radius:4px;font-size:10px;font-weight:700;border:1px solid var(--green-b)}

.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-title{font-size:15px;font-weight:700}

.cal-cell.dim{background:var(--hover);opacity:.4}
.cal-cell.today{border-color:var(--red)}
.cal-num{font-size:11px;font-weight:700;color:var(--t3);margin-bottom:2px}
.cal-cell.today .cal-num{background:var(--red);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px}
.cal-ev{background:var(--green-bg);color:var(--green);border-radius:3px;padding:2px 5px;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;border-left:2px solid var(--green)}
.cal-more{font-size:10px;color:var(--t3);margin-top:2px;padding-left:4px}
.setup-wrap{max-width:520px;margin:2rem auto}
.steps{list-style:none;margin-bottom:1.5rem}

.sn{min-width:22px;height:22px;border-radius:50%;background:var(--red-bg);color:var(--red);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.steps a{color:var(--blue)}.steps code{background:var(--hover);padding:1px 6px;border-radius:4px;font-size:11px;font-family:monospace}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(3px)}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;width:400px;max-width:calc(100vw - 2rem);box-shadow:var(--sh2)}
.modal h3{font-size:16px;font-weight:800;margin-bottom:1.25rem}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:1.25rem}
.color-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.cswatch:hover{transform:scale(1.15)}
.cswatch.sel{border-color:var(--text)}
.empty{text-align:center;padding:3rem 1rem;color:var(--t3)}
.loader{display:flex;align-items:center;justify-content:center;gap:10px;padding:3rem;color:var(--t2);font-size:13px}
.loader-detail{font-size:11px;color:var(--t3);margin-top:4px}
.spinner{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

.toast.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-b)}
.toast.err{background:#FEE2E2;color:#991B1B;border:1px solid #FCA5A5}

.vscroll{max-height:520px;overflow-y:auto;padding-right:2px}
.vscroll::-webkit-scrollbar{width:5px}
.vscroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>

<script>
/* ── helpers ── */
function getClientIds(){
  var ids=(CONFIG.clientIds||[]).filter(function(x){return x&&x.trim()});
  if(!ids.length&&CONFIG.clientId)ids=[CONFIG.clientId];
  return ids;
}

/* ── state ── */
var A={
  step:'setup',channels:lsCh(),active:null,token:'',
  cidIdx:0,tokenExpiry:0,
  videos:[],scheduled:{},
  filter:'all',tab:'list',openPanel:null,modal:null,
  newCh:{name:'',cid:'',color:'#FF0000'},
  calM:new Date().getMonth(),calY:new Date().getFullYear(),
  ytChannels:[],ytSelectedChannel:null,
  uploadsPlaylistId:'',   // ← cache playlist ID, tidak perlu fetch ulang
  hidden:{},showHidden:false,
  quotaStatus:{},         // cidIdx -> 'ok'|'dead'
  loadMsg:'',             // pesan progress saat loading
  bulk:{
    subTab:'unsched',mode:'interval',interval:1,customN:3,
    startDate:'',time:'00:00',selected:[],customDates:{}
  }
};
var COLORS=['#FF0000','#1A7F3C','#1A56DB','#9333EA','#EA580C','#0891B2','#BE185D','#CA8A04'];

/* ── localStorage ── */
function lsCh(){
  var stored=[];try{stored=JSON.parse(localStorage.getItem('yt_ch')||'[]')}catch(e){}
  var ids=getClientIds(),cid0=ids[0]||'';
  if(cid0&&CONFIG.channels&&CONFIG.channels.length){
    CONFIG.channels.forEach(function(c){
      var exists=stored.find(function(s){return s.name===c.name});
      if(!exists)stored.unshift({id:'cfg_'+c.name.replace(/\s/g,'_'),name:c.name,cid:cid0,color:c.color||'#FF0000',fromConfig:true});
      else if(!exists.cid)exists.cid=cid0;
    });
  }
  if(cid0)stored.forEach(function(c){if(!c.cid)c.cid=cid0;});
  return stored;
}

/* ── utils ── */
function tzOffset(){return-new Date().getTimezoneOffset()/60}
function tzLabel(){var o=tzOffset();var n={7:'WIB',8:'WITA',9:'WIT'};return n[o]||(o>=0?'UTC+'+o:'UTC'+o)}
function localToUTC(date,time){return new Date(date+'T'+(time||'00:00')+':00').toISOString()}
function utcToLocal(iso){
  if(!iso)return{date:'',time:''};
  var d=new Date(iso);
  return{date:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),time:pad(d.getHours())+':'+pad(d.getMinutes())};
}
function pad(n){return String(n).padStart(2,'0')}
function addDays(s,days){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+days);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtDate(iso){if(!iso)return'';return new Date(iso).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function fmtShort(s){if(!s)return'-';return new Date(s+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
function isSoon(iso){if(!iso)return false;var d=new Date(iso)-Date.now();return d>0&&d<7*864e5}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function $(id){return document.getElementById(id)}
function val(id){return($( id)||{}).value||''}
function today(){return new Date().toISOString().split('T')[0]}
function tomorrow(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function isQuotaErr(msg){return(msg||'').toLowerCase().includes('quota')||(msg||'').includes('quotaExceeded')}

function toast(msg,type){

  $('toasts').appendChild(el);

/* ── SIGN IN ── */
async function signIn(ch,cidIdxOverride){
  try{
    await loadGIS();
    var ids=getClientIds();
    var cid=ch.cid;
    if(!cid){
      if(cidIdxOverride!==undefined)A.cidIdx=cidIdxOverride;
      cid=ids[A.cidIdx%Math.max(ids.length,1)]||'';
    }
    if(!cid){toast('Client ID belum diisi di CONFIG','err');return;}
    google.accounts.oauth2.initTokenClient({
      client_id:cid,
      scope:'https://www.googleapis.com/auth/youtube',
      callback:async function(r){
        if(r.error){
          var nextIdx=A.cidIdx+1;
          if(ids.length>1&&nextIdx<ids.length){
            toast('Client ID #'+(A.cidIdx+1)+' gagal, coba #'+(nextIdx+1)+'...','inf');
            A.cidIdx=nextIdx;
            setTimeout(function(){signIn(ch,nextIdx)},500);
          }else{
            toast('Login gagal: '+r.error,'err');
          }
          return;
        }
        A.token=r.access_token;
        A.tokenExpiry=Date.now()+(r.expires_in||3600)*1000;
        A.quotaStatus[A.cidIdx]='ok';
        A.active=ch;A.scheduled=loadSched(ch);A.hidden=loadHidden(ch);
        // Coba load cached playlist ID
        A.uploadsPlaylistId=lsPlaylist(ch);
        A.step='loading';render();
        await pickChannel();
      }
    }).requestAccessToken({prompt:'select_account'});
  }catch(e){toast('Error: '+e.message,'err');}
}

/* ── SWITCH CID SAAT QUOTA HABIS ──────────────────────────────
   FIX: dulu pakai prompt:'' yang gagal diam-diam kalau project
   baru belum di-authorize. Sekarang tampilkan popup select_account
   + instruksi jelas ke user agar pilih akun yang benar.
─────────────────────────────────────────────────────────────── */
function switchToNextCid(){
  return new Promise(function(resolve){
    var ids=getClientIds();
    // Cari index berikutnya yang belum dead
    var found=-1;
    for(var i=1;i<=ids.length;i++){
      var tryIdx=(A.cidIdx+i)%ids.length;
      if(A.quotaStatus[tryIdx]!=='dead'){found=tryIdx;break;}
    }
    if(found<0||found===A.cidIdx){
      toast('Quota semua '+ids.length+' project habis hari ini 😭','err');
      resolve(false);return;
    }
    A.cidIdx=found;
    var newCid=ids[A.cidIdx];
    // Tampilkan instruksi sebelum popup muncul
    toast('Quota habis! Ganti ke project #'+(A.cidIdx+1)+' — pilih akun di popup...','inf');
    try{
      google.accounts.oauth2.initTokenClient({
        client_id:newCid,
        scope:'https://www.googleapis.com/auth/youtube',
        callback:function(r){
          if(!r.error&&r.access_token){
            A.token=r.access_token;
            A.tokenExpiry=Date.now()+(r.expires_in||3600)*1000;
            A.quotaStatus[A.cidIdx]='ok';
            A._warned=false;
            toast('✓ Beralih ke project #'+(A.cidIdx+1),'ok');
            resolve(true);
          }else{
            // Project ini gagal juga, tandai dead dan coba rekursif
            A.quotaStatus[A.cidIdx]='dead';
            toast('Project #'+(A.cidIdx+1)+' gagal, coba berikutnya...','inf');
            resolve(switchToNextCid());
          }
        }
      // FIX UTAMA: select_account agar user bisa pilih akun yang tepat
      // untuk project baru. prompt:'' hanya berhasil kalau sudah pernah
      // authorize sebelumnya — kalau belum, Google diam-diam tidak return token.
      }).requestAccessToken({prompt:'select_account'});
    }catch(e){
      A.quotaStatus[A.cidIdx]='dead';
      resolve(false);
    }
  });
}

function rotateClientId(){
  var ids=getClientIds();
  if(ids.length<=1){toast('Hanya ada 1 Client ID di config','inf');return;}
  A.cidIdx=(A.cidIdx+1)%ids.length;

/* ═══════════════════════════════════════════════════════════
   FETCH VIDEOS — HEMAT QUOTA
   DULU:  search.list = 100 unit/halaman  → 400 unit untuk 200 video
   BARU:  playlistItems.list = 1 unit/halaman → 4 unit untuk 200 video
   HEMAT: ~50x lebih hemat!
   ═══════════════════════════════════════════════════════════ */
async function fetchVideos(retryCount){
  retryCount=retryCount||0;
  var ids=getClientIds();

  async function doFetch(){
    // ── Step 1: Dapatkan uploads playlist ID (1 unit) ─────────
    // Cek cache dulu — tidak perlu fetch ulang kalau sudah ada
    var playlistId=A.uploadsPlaylistId;
    if(!playlistId){
      setLoadMsg('Mengambil info channel (1 unit)...');
      var rc=await fetch('https://www.googleapis.com/youtube/v3/channels?part=contentDetails&mine=true',
        {headers:{Authorization:'Bearer '+A.token}});
      var dc=await rc.json();
      if(dc.error)throw dc.error;
      if(!dc.items||!dc.items.length)throw{message:'Channel tidak ditemukan',code:404};
      playlistId=dc.items[0].contentDetails.relatedPlaylists.uploads;
      A.uploadsPlaylistId=playlistId;
      if(A.active)savePlaylist(A.active,playlistId);
    }

    // ── Step 2: Ambil semua video ID via playlistItems (1 unit/halaman) ──
    var allItems=[],pageToken='',page=0;
    do{
      page++;
      setLoadMsg('Memuat daftar video halaman '+page+' ('+allItems.length+' video, '+page+' unit)...');
      var url='https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails,snippet&playlistId='+
              encodeURIComponent(playlistId)+'&maxResults=50';
      if(pageToken)url+='&pageToken='+encodeURIComponent(pageToken);
      var r1=await fetch(url,{headers:{Authorization:'Bearer '+A.token}});
      var d1=await r1.json();
      if(d1.error)throw d1.error;
      if(d1.items)allItems=allItems.concat(d1.items);
      pageToken=d1.nextPageToken||'';
    }while(pageToken);

    if(!allItems.length){return[];}

    // ── Step 3: Fetch detail (status, thumbnail) batch 50 (1 unit/batch) ──
    var allVideos=[],totalBatches=Math.ceil(allItems.length/50);
    for(var b=0;b<allItems.length;b+=50){
      var batchNum=Math.floor(b/50)+1;
      setLoadMsg('Mengambil detail video (batch '+batchNum+'/'+totalBatches+')...');
      var batch=allItems.slice(b,b+50);
      var vids=batch.map(function(i){return i.contentDetails&&i.contentDetails.videoId}).filter(Boolean).join(',');
      if(!vids)continue;
      var r2=await fetch('https://www.googleapis.com/youtube/v3/videos?part=snippet,status,contentDetails&id='+vids,
        {headers:{Authorization:'Bearer '+A.token}});
      var d2=await r2.json();
      if(d2.error)throw d2.error;
      allVideos=allVideos.concat(d2.items||[]);
    }
    return allVideos;
  }

  try{
    setLoadMsg('Memulai...');
    var allVideos=await doFetch();
    A.videos=allVideos;
    // Baca jadwal yang sudah ada di YouTube
    A.videos.forEach(function(v){if(v.status&&v.status.publishAt)A.scheduled[v.id]=v.status.publishAt;});
    A.quotaStatus[A.cidIdx]='ok';
    saveSched();
    A.step='dashboard';
    render();
    // Update summary di header
    var totalCost=Math.ceil(allVideos.length/50)+Math.ceil(allVideos.length/50)+1;
    updateQuotaSummary('~'+totalCost+' unit dipakai untuk '+allVideos.length+' video');
  }catch(e){
    var msg=e.message||String(e);
    var code=e.code||0;
    if(isQuotaErr(msg)){
      // Tandai project ini dead
      A.quotaStatus[A.cidIdx]='dead';
      if(retryCount<ids.length-1){
        var switched=await switchToNextCid();
        if(switched){
          // Reset playlist cache agar tidak pakai playlist ID lama yang mungkin salah akun
          A.uploadsPlaylistId='';
          A.step='loading';render();
          return fetchVideos(retryCount+1);
        }
      }
      msg='Quota semua '+ids.length+' project habis — coba lagi besok';
    }else if(code===403||msg.includes('403')){
      msg='Akses ditolak — pastikan YouTube Data API v3 aktif di project ini';
    }else if(code===401||msg.includes('401')){
      msg='Token tidak valid — coba Sign In ulang';
    }
    toast('Gagal memuat: '+msg,'err');
    A.step='pick_channel';render();
  }
}

function updateQuotaSummary(msg){
  var el=$('quota-summary');
  if(el)el.textContent=msg;
}

/* ── API SET/UNSET dengan auto-retry quota ── */
async function apiCall(videoId,body){
  var ids=getClientIds();
  for(var attempt=0;attempt<ids.length;attempt++){
    try{
      var r=await fetch('https://www.googleapis.com/youtube/v3/videos?part=status',{
        method:'PUT',headers:{Authorization:'Bearer '+A.token,'Content-Type':'application/json'},
        body:JSON.stringify(body)
      });
      var d=await r.json();
      if(d.error){
        if(isQuotaErr(d.error.message)&&attempt<ids.length-1){
          A.quotaStatus[A.cidIdx]='dead';
          var ok=await switchToNextCid();
          if(!ok)throw new Error('Quota semua project habis');
          continue;
        }
        throw new Error(d.error.message);
      }
      return d;
    }catch(e){
      if(attempt>=ids.length-1)throw e;
    }
  }
}
function apiSet(videoId,publishAt){
  return apiCall(videoId,{id:videoId,status:{privacyStatus:'private',publishAt:publishAt}});
}
function apiUnset(videoId){
  return apiCall(videoId,{id:videoId,status:{privacyStatus:'private'}});
}

/* ── bulk ── */
function getBulkPreview(){
  var b=A.bulk,sel=b.selected,time=val('b-time')||b.time,result=[];
  if(b.mode==='interval'){
    var start=val('b-start')||b.startDate;
    if(!start||!sel.length)return[];
    for(var i=0;i<sel.length;i++){
      var ds=addDays(start,i*b.interval);
      result.push({id:sel[i],date:ds,time:time,publishAt:localToUTC(ds,time)});
    }
  }else{
    for(var i=0;i<sel.length;i++){
      var id=sel[i],ds=val('bc-'+id)||b.customDates[id]||'';
      if(ds)result.push({id:id,date:ds,time:time,publishAt:localToUTC(ds,time)});
    }
  }
  return result;
}
async function applyBulk(){
  A.bulk.time=val('b-time')||A.bulk.time;
  if(A.bulk.mode==='interval')A.bulk.startDate=val('b-start')||A.bulk.startDate;
  if(A.bulk.mode==='custom')A.bulk.selected.forEach(function(id){var v=val('bc-'+id);if(v)A.bulk.customDates[id]=v;});
  var preview=getBulkPreview();
  if(!preview.length){toast('Tidak ada jadwal untuk diterapkan','err');return;}
  var btn=$('bulk-apply');if(btn){btn.disabled=true;btn.textContent='Menyimpan...';}
  var ok=0,fail=0;
  for(var i=0;i<preview.length;i++){
    try{await apiSet(preview[i].id,preview[i].publishAt);A.scheduled[preview[i].id]=preview[i].publishAt;ok++;if(btn)btn.textContent='Menyimpan '+ok+'/'+preview.length+'...';}
    catch(e){fail++;}
  }
  saveSched();
  if(fail===0)toast('✓ '+ok+' video berhasil dijadwalkan!','ok');
  else toast(ok+' berhasil, '+fail+' gagal','inf');
  if(btn){btn.disabled=false;btn.textContent='Terapkan Jadwal';}
  render();
}

  var name=val('nc-name').trim()||'Channel Baru',cid=val('nc-cid').trim()||getClientIds()[0]||'';
  if(!cid){toast('Masukkan Client ID','err');return;}

function delChannel(id){
  A.channels=A.channels.filter(function(c){return c.id!==id});saveCh();
  if(A.active&&A.active.id===id){A.token='';A.videos=[];A.scheduled={};A.step='setup';A.active=null;}
  render();toast('Channel dihapus','inf');
}
function getDrafts(){
  return A.videos.filter(function(v){
    if(A.hidden[v.id])return false;
    var s=(v.status||{}).privacyStatus;
    return s==='private'||s==='unlisted';
  });
}
function getFiltered(){
  var d=getDrafts();
  if(A.filter==='scheduled')return d.filter(function(v){return A.scheduled[v.id]});
  if(A.filter==='unscheduled')return d.filter(function(v){return!A.scheduled[v.id]});
  return d;
}
function getThumb(v){var t=v.snippet&&v.snippet.thumbnails;return t&&(t.medium||t.default);}
function getTitle(v){return(v.snippet&&v.snippet.title)||'Untitled'}

/* ── GitHub ── */
function ghGet(key){return localStorage.getItem('gh_'+key)||''}
function ghSet(key,v){localStorage.setItem('gh_'+key,v)}
function toB64(str){return btoa(unescape(encodeURIComponent(str)))}
async function ghFetchFile(){
  var token=ghGet('token'),repo=ghGet('repo');
  if(!token||!repo)throw new Error('GitHub token / repo belum diset');
  var r=await fetch('https://api.github.com/repos/'+repo+'/contents/index.html',
    {headers:{Authorization:'token '+token,'Accept':'application/vnd.github.v3+json'}});
  if(!r.ok)throw new Error('GitHub API error '+r.status);
  return r.json();
}
async function saveConfigToGitHub(){
  var clientId=val('cfg-cid').trim();if(!clientId){toast('Masukkan Client ID','err');return;}
  var chInputs=document.querySelectorAll('.ch-cfg-row'),channels=[];
  chInputs.forEach(function(row){var n=row.querySelector('.ch-cfg-name'),c=row.querySelector('.ch-cfg-color');if(n&&n.value.trim())channels.push({name:n.value.trim(),color:c?c.value:'#FF0000'});});
  if(!channels.length){toast('Tambahkan minimal 1 channel','err');return;}
  var token=val('cfg-token').trim(),repo=val('cfg-repo').trim();
  if(!token||!repo){toast('Isi GitHub Token dan Repo','err');return;}
  ghSet('token',token);ghSet('repo',repo);
  var btn=$('btn-save-cfg');btn.disabled=true;btn.textContent='Menyimpan ke GitHub...';
  try{
    var fileData=await ghFetchFile();
    var current=decodeURIComponent(escape(atob(fileData.content.replace(/\n/g,'')))),sha=fileData.sha;
    var chLines=channels.map(function(c){return"    { name: '"+c.name.replace(/'/g,"\\'")+"', color: '"+c.color+"' }";}).join(',\n');
    var allCids=getClientIds();if(clientId&&!allCids.includes(clientId))allCids.unshift(clientId);if(!allCids.length)allCids=[''];
    var cidLines=allCids.concat(['','']).slice(0,3).map(function(c,i){return"    '"+c+"',   // Client ID #"+(i+1)+(i===0?' (utama)':' (cadangan)');}).join('\n');
    var newConfig="var CONFIG = {\n  clientIds: [\n"+cidLines+"\n  ],\n\n  channels: [\n"+chLines+"\n  ]\n};";
    var newContent=current.replace(/var CONFIG = \{[\s\S]*?\};/,newConfig);
    if(newContent===current)throw new Error('Tidak bisa menemukan blok CONFIG di file.');
    var r=await fetch('https://api.github.com/repos/'+repo+'/contents/index.html',{
      method:'PUT',headers:{Authorization:'token '+token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
      body:JSON.stringify({message:'Update YT Scheduler config via app',content:toB64(newContent),sha:sha})
    });
    var rd=await r.json();if(!r.ok)throw new Error(rd.message||'GitHub error '+r.status);
    toast('✓ Berhasil disimpan ke GitHub!','ok');A.modal=null;
    setTimeout(function(){if(confirm('Config tersimpan! Muat ulang halaman sekarang?'))location.reload();},1500);
  }catch(e){toast('Gagal: '+e.message,'err');}
  finally{if(btn){btn.disabled=false;btn.textContent='Simpan ke GitHub';}}
}

  var l=$('ch-cfg-list');if(!l)return;

  row.innerHTML='<input class="ch-cfg-name" type="text" placeholder="Nama channel baru" style="flex:1;padding:7px 9px;font-size:13px;border:1px solid var(--border2);border-radius:var(--r2);background:var(--card);color:var(--text)">'+

/* ── token label + ticker ── */
function tokenRemainingLabel(){
  if(!A.tokenExpiry)return'';
  var ms=A.tokenExpiry-Date.now();
  if(ms<=0)return'<span style="color:var(--red);font-size:11px;font-weight:700;padding:2px 7px;background:var(--red-bg);border-radius:4px">⚠ Expired</span>';
  var m=Math.floor(ms/60000);
  var color=m<10?'var(--red)':(m<30?'var(--orange)':'var(--green)');
  var bg=m<10?'var(--red-bg)':(m<30?'var(--orange-bg)':'var(--green-bg)');
  return'<span style="font-size:11px;font-weight:700;color:'+color+';padding:2px 7px;background:'+bg+';border-radius:4px">⏱ '+m+' mnt</span>';
}
setInterval(function(){
  if(A.step==='dashboard'){
    renderHeader();
    var ms=A.tokenExpiry?A.tokenExpiry-Date.now():999999;
    if(ms>0&&ms<5*60000&&!A._warned){
      A._warned=true;
      toast(getClientIds().length>1?'Token hampir habis — akan otomatis ganti project':'Token habis dalam <5 menit, siap-siap Sign In ulang','inf');
    }
    if(A.tokenExpiry&&Date.now()>A.tokenExpiry&&A.active){
      A.tokenExpiry=0;A._warned=false;
      var ids=getClientIds();
      if(ids.length>1){A.cidIdx=(A.cidIdx+1)%ids.length;toast('Token expired → ganti ke project #'+(A.cidIdx+1),'inf');signIn(A.active,A.cidIdx);}
      else{toast('Token expired — silakan Sign In ulang','inf');renderHeader();}
    }
  }
},30000);

  var scheduled=allDrafts.filter(function(v){return!!A.scheduled[v.id]});
  scheduled.sort(function(a,b){return new Date(A.scheduled[a.id])-new Date(A.scheduled[b.id])});
  var h='<div style="display:flex;gap:0;margin-bottom:1.25rem;border-bottom:1px solid var(--border)">';
  h+='<button class="tab'+(b.subTab==='unsched'?' active':'')+'" onclick="A.bulk.subTab=\'unsched\';render()">📋 Belum Dijadwalkan <span style="background:var(--orange-bg);color:var(--orange);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px">'+unscheduled.length+'</span></button>';
  h+='<button class="tab'+(b.subTab==='sched'?' active':'')+'" onclick="A.bulk.subTab=\'sched\';render()">✅ Sudah Terjadwal <span style="background:var(--green-bg);color:var(--green);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px">'+scheduled.length+'</span></button>';
  h+='</div>';
  if(b.subTab==='sched')h+=renderBulkScheduled(scheduled);
  else h+=renderBulkUnsched(unscheduled,b);
  return h;
}
function renderBulkScheduled(scheduled){
  if(!scheduled.length)return'<div class="empty"><div style="font-size:38px;margin-bottom:8px">📭</div><p style="font-size:13px">Belum ada video yang terjadwal.</p></div>';
  var h='<div class="info-green" style="margin-bottom:12px">✅ <b>'+scheduled.length+' video</b> sudah terjadwal.</div>';
  h+='<div style="overflow-x:auto"><table class="ptable" style="width:100%"><thead><tr><th class="pnum">#</th><th>Video</th><th>Jadwal Publish</th><th style="width:110px">Aksi</th></tr></thead><tbody>';
  scheduled.forEach(function(v,i){
    var iso=A.scheduled[v.id],thumb=getThumb(v),title=getTitle(v),isSn=isSoon(iso);
    h+='<tr><td class="pnum">'+(i+1)+'</td><td style="vertical-align:middle"><div style="display:flex;align-items:center;gap:8px">';
    h+=(thumb?'<img src="'+esc(thumb.url)+'" style="width:56px;height:32px;object-fit:cover;border-radius:3px;flex-shrink:0" loading="lazy">':'<div style="width:56px;height:32px;background:var(--hover);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">▶</div>');
    h+='<span class="ptitle" style="max-width:180px" title="'+esc(title)+'">'+esc(title)+'</span></div></td>';
    h+='<td><span class="badge '+(isSn?'b-soon':'b-sched')+'" style="font-size:11px">'+(isSn?'⏰ ':'')+esc(fmtDate(iso))+'</span></td>';
    h+='<td><div style="display:flex;gap:4px"><button class="btn btn-xs" onclick="openPanel(\''+v.id+'\');A.tab=\'list\';render()" title="Ubah">✏</button><button class="btn btn-xs" style="color:var(--red)" onclick="doUnschedule(\''+v.id+'\')" title="Hapus">✕</button></div></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:flex-end"><button class="btn btn-sm" style="color:var(--red);border-color:var(--red-b)" onclick="confirmUnscheduleAll()">✕ Hapus Semua Jadwal</button></div>';
  return h;
}
function renderBulkUnsched(unscheduled,b){
  var selCount=b.selected.length;
  var h='<div class="bulk-wrap">';
  var left='<div class="panel"><div class="panel-head">⚙️ Pengaturan Jadwal Massal</div><div class="panel-body">';
  left+='<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:8px">Mode Penjadwalan</div>';
  left+='<div class="mode-opts">';
  left+='<label class="mode-opt'+(b.mode==='interval'?' selected':'')+'"><input type="radio" name="bmode" value="interval" onchange="setMode(\'interval\')" '+(b.mode==='interval'?'checked':'')+'>'+
    '<div class="mode-opt-text"><strong>📅 Interval Otomatis</strong><span>1 video per N hari dari tanggal mulai</span></div></label>';
  left+='<label class="mode-opt'+(b.mode==='custom'?' selected':'')+'"><input type="radio" name="bmode" value="custom" onchange="setMode(\'custom\')" '+(b.mode==='custom'?'checked':'')+'>'+
    '<div class="mode-opt-text"><strong>🗓 Pilih Tanggal Sendiri</strong><span>Tentukan tanggal berbeda untuk tiap video</span></div></label>';
  left+='</div>';
  if(b.mode==='interval'){
    left+='<div class="fg"><label>Tanggal Mulai</label><input type="date" id="b-start" min="'+today()+'" value="'+esc(b.startDate||tomorrow())+'" oninput="A.bulk.startDate=this.value;render()"></div>';
    left+='<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:7px">Interval</div>';
    left+='<div class="interval-row">';
    [1,2,3,7].forEach(function(n){left+='<button class="interval-btn'+(b.interval===n?' sel':'')+'" onclick="setInterval2('+n+')">'+(n===1?'Tiap Hari':n===7?'Tiap Minggu':n+' Hari')+'</button>';});
    left+='<div style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--t2)">Custom:<input class="custom-n" type="number" min="1" max="365" value="'+b.customN+'" oninput="A.bulk.customN=parseInt(this.value)||1" id="b-custn">'+
      '<button class="btn btn-xs" onclick="setInterval2(parseInt(val(\'b-custn\'))||1)">OK</button></div>';
    left+='</div>';
  }
  left+='<div class="fg" style="margin-top:12px"><label>Jam Publish — '+tzLabel()+'</label><input type="time" id="b-time" value="'+esc(b.time)+'" oninput="A.bulk.time=this.value"></div>';
  left+='</div></div>';

  var right='<div>';
  right+='<div class="panel" style="margin-bottom:12px"><div class="panel-head">📋 Pilih Video <button class="btn btn-xs btn-ghost" onclick="selectAllBulk()">'+(selCount===unscheduled.length&&unscheduled.length>0?'Batal Semua':'Pilih Semua')+'</button></div><div class="panel-body" style="padding:10px">';
  if(!unscheduled.length){
    right+='<div class="empty" style="padding:1.5rem"><p style="font-size:13px">Semua draft sudah terjadwal! 🎉</p></div>';
  }else{
    right+='<div class="info-blue" style="font-size:11px;margin-bottom:8px">💡 Hanya video belum dijadwalkan. Atur urutan dengan ↑↓.</div><div class="sel-list">';
    var selSet=new Set(b.selected);
    var orderedSel=b.selected.filter(function(id){return unscheduled.find(function(v){return v.id===id})});
    var orderedList=orderedSel.map(function(id){return A.videos.find(function(v){return v.id===id})}).filter(Boolean);
    var unsel=unscheduled.filter(function(v){return!selSet.has(v.id)});
    orderedList.concat(unsel).forEach(function(v){
      var checked=selSet.has(v.id),thumb=getThumb(v),title=getTitle(v),pos=b.selected.indexOf(v.id);
      right+='<div class="sel-row'+(checked?' checked':'')+'" onclick="toggleBulkSel(\''+v.id+'\')">';
      right+='<input type="checkbox" '+(checked?'checked':'')+' onclick="event.stopPropagation();toggleBulkSel(\''+v.id+'\')">';
      right+=(thumb?'<img class="sthumb" src="'+esc(thumb.url)+'" alt="" loading="lazy">':'<div class="sthumb-ph">▶</div>');
      right+='<span class="stitle" title="'+esc(title)+'">'+esc(title)+'</span>';
      if(checked){
        right+='<span style="font-size:10px;font-weight:700;color:var(--red);min-width:16px;text-align:center">#'+(pos+1)+'</span>';
        right+='<div class="reorder" onclick="event.stopPropagation()"><button onclick="moveUp(\''+v.id+'\')" '+(pos===0?'disabled':'')+'>▲</button><button onclick="moveDown(\''+v.id+'\')" '+(pos===b.selected.length-1?'disabled':'')+'>▼</button></div>';
      }
      right+='</div>';
    });
    right+='</div>';
  }
  right+='</div></div>';
  right+='<div class="panel"><div class="panel-head">👁 Preview Jadwal <span style="font-size:11px;color:var(--t3);font-weight:500">'+selCount+' video</span></div><div class="panel-body">';
  if(!selCount){
    right+='<div class="empty" style="padding:1.5rem"><p style="font-size:13px">Pilih video di atas untuk melihat preview.</p></div>';
  }else if(b.mode==='interval'){
    var startVal=b.startDate||tomorrow();
    right+='<div style="overflow-x:auto"><table class="ptable"><thead><tr><th class="pnum">#</th><th>Video</th><th>Tanggal Publish</th></tr></thead><tbody>';
    b.selected.forEach(function(id,i){var v=A.videos.find(function(x){return x.id===id});if(!v)return;var ds=addDays(startVal,i*b.interval);right+='<tr><td class="pnum">'+(i+1)+'</td><td class="ptitle">'+esc(getTitle(v))+'</td><td class="pdate">'+esc(fmtShort(ds))+'</td></tr>';});
    right+='</tbody></table></div>';
    right+='<div class="info-green" style="margin-top:10px;font-size:11px">✓ '+selCount+' video mulai <b>'+esc(fmtShort(startVal))+'</b>, setiap <b>'+b.interval+' hari</b>, jam <b>'+(b.time||'00:00')+' '+tzLabel()+'</b></div>';
  }else{
    right+='<div style="font-size:11px;color:var(--t2);margin-bottom:8px">Pilih tanggal masing-masing. Jam: <b>'+(b.time||'00:00')+'</b> '+tzLabel()+'</div>';
    right+='<div style="overflow-x:auto"><table class="ptable"><thead><tr><th class="pnum">#</th><th>Video</th><th>Tanggal</th></tr></thead><tbody>';
    b.selected.forEach(function(id,i){var v=A.videos.find(function(x){return x.id===id});if(!v)return;var ex=b.customDates[id]||'';right+='<tr><td class="pnum">'+(i+1)+'</td><td class="ptitle">'+esc(getTitle(v))+'</td><td class="pdate-custom"><input type="date" id="bc-'+id+'" min="'+today()+'" value="'+esc(ex)+'" oninput="A.bulk.customDates[\''+id+'\']=this.value"></td></tr>';});
    right+='</tbody></table></div>';
  }
  right+='</div>';
  if(selCount>0){
    right+='<div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px">'+
      '<span style="font-size:12px;color:var(--t3)">'+selCount+' video akan dijadwalkan</span>'+
      '<button class="btn btn-red" id="bulk-apply" onclick="saveBulkValues()">🚀 Terapkan Jadwal</button></div>';
  }
  right+='</div></div>';
  h+=left+right+'</div>';
  return h;
}

/* ── calendar ── */
function renderCalendar(){
  var MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  var DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  var y=A.calY,m=A.calM,ev={};
  Object.entries(A.scheduled).forEach(function(e){
    var d=new Date(e[1]);if(d.getFullYear()!==y||d.getMonth()!==m)return;
    var k=d.getDate();if(!ev[k])ev[k]=[];var v=A.videos.find(function(x){return x.id===e[0]});if(v)ev[k].push(v);
  });
  var td=new Date(),first=new Date(y,m,1),sd=first.getDay(),dim=new Date(y,m+1,0).getDate(),pp=new Date(y,m,0).getDate();
  var h='<div class="cal-nav"><button class="btn btn-sm" onclick="A.calM--;if(A.calM<0){A.calM=11;A.calY--;}render()">← Prev</button><span class="cal-title">'+MONTHS[m]+' '+y+'</span><button class="btn btn-sm" onclick="A.calM++;if(A.calM>11){A.calM=0;A.calY++;}render()">Next →</button></div><div class="cal-grid">';
  DAYS.forEach(function(d){h+='<div class="cal-head">'+d+'</div>';});
  for(var i=0;i<42;i++){
    var day,off=false;
    if(i<sd){day=pp-sd+i+1;off=true;}else if(i>=sd+dim){day=i-sd-dim+1;off=true;}else day=i-sd+1;
    var isT=!off&&day===td.getDate()&&m===td.getMonth()&&y===td.getFullYear();
    var evs=off?[]:(ev[day]||[]);
    h+='<div class="cal-cell'+(off?' dim':'')+(isT?' today':'')+'"><div class="cal-num">'+day+'</div>';
    evs.slice(0,2).forEach(function(v){var t=getTitle(v);h+='<div class="cal-ev" title="'+esc(t)+'">'+esc(t.length>16?t.slice(0,14)+'…':t)+'</div>';});
    if(evs.length>2)h+='<div class="cal-more">+'+(evs.length-2)+' lagi</div>';
    h+='</div>';
  }
  return h+'</div>';
}

/* ── dashboard ── */
function renderDashboard(){
  var h=renderChBar()+renderQuotaBar()+renderStats();
  h+='<div class="tabs">'+
    '<button class="tab'+(A.tab==='list'?' active':'')+'" onclick="A.tab=\'list\';A.openPanel=null;render()">📋 Per Video</button>'+
    '<button class="tab'+(A.tab==='bulk'?' active':'')+'" onclick="A.tab=\'bulk\';A.openPanel=null;render()">🚀 Jadwal Massal</button>'+
    '<button class="tab'+(A.tab==='cal'?' active':'')+'" onclick="A.tab=\'cal\';render()">📅 Kalender</button>'+
  '</div>';
  if(A.tab==='list')h+=renderPerVideo();
  else if(A.tab==='bulk')h+=renderBulk();
  else h+=renderCalendar();
  return h;
}

/* ── add channel modal ── */
function renderAddChModal(){
  var sw=COLORS.map(function(c){return'<div class="cswatch'+(A.newCh.color===c?' sel':'')+'" style="background:'+c+'" onclick="A.newCh.color=\''+c+'\';render()"></div>';}).join('');
  var cidField=getClientIds().length>0?'<div class="info-blue" style="font-size:12px;margin-bottom:10px">✓ Menggunakan Client ID dari config.</div>':
    '<div class="fg"><label>OAuth Client ID</label><input id="nc-cid" type="text" placeholder="xxxxxxxx.apps.googleusercontent.com" value="'+esc(A.newCh.cid)+'"></div>';
  return'<div class="overlay" onclick="if(event.target===this){A.modal=null;render()}">'+
    '<div class="modal"><h3>➕ Tambah Channel Baru</h3>'+
    '<div class="fg"><label>Nama Channel</label><input id="nc-name" type="text" placeholder="Channel Gaming" value="'+esc(A.newCh.name)+'"></div>'+
    cidField+'<div class="fg"><label>Warna Label</label><div class="color-row">'+sw+'</div></div>'+
    '<div class="modal-footer"><button class="btn btn-sm" onclick="A.modal=null;render()">Batal</button>'+
    '<button class="btn btn-red btn-sm" onclick="A.newCh.name=val(\'nc-name\');A.newCh.cid=val(\'nc-cid\')||getClientIds()[0]||\'\';addChannel()">Hubungkan →</button></div>'+
    '</div></div>';
}

/* ── main render ── */
function render(){
  var root=$('root');if(!root)return;
  var h='';
  if(A.step==='setup')h=renderSetup();
  else if(A.step==='loading')h='<div class="loader"><div class="spinner"></div><div><div>Memuat video dari YouTube...</div><div class="loader-detail" id="load-msg">'+esc(A.loadMsg)+'</div></div></div>';
  else if(A.step==='pick_channel')h=renderPickChannel();
  else if(A.step==='dashboard')h=renderDashboard();
  if(A.modal==='addch')h+=renderAddChModal();
  if(A.modal==='cfg')h+=renderCfgModal();
  root.innerHTML=h;renderHeader();
}

/* ── boot ── */
A.channels=lsCh();
if(A.channels.length&&getClientIds().length)A.step='setup';
render();
</script>
